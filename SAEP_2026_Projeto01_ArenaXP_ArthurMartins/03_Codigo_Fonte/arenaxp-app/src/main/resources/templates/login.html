<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ArenaXP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrap">
    <div class="card login-card">
        <span class="brand">Arena<span>XP</span></span>
        <p class="sub">Gestão de Equipamentos ESports</p>

        <div class="msg msg-erro" th:if="${param.erro}">E-mail ou senha inválidos. Verifique e tente novamente.</div>
        <div class="msg msg-sucesso" th:if="${param.logout}">Você saiu do sistema com sucesso.</div>

        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required autofocus>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>

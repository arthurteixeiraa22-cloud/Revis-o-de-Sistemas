spring.application.name=arenaxp
server.port=8080

# --- MySQL (schema arenaxp_db criado pelo script 02_Banco_de_Dados/arenaxp_db.sql) ---
# Ajuste usuario/senha aqui OU defina as variaveis de ambiente DB_USER / DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/arenaxp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# O schema e gerenciado pelo script SQL (o Hibernate NAO cria/altera tabelas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
